
spring.application.name=jeevantax

# Server
server.port=${PORT:8080}

# MongoDB Atlas
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/jeevantax}

# JWT
jwt.secret=${JWT_SECRET}

# Pinata
pinata.jwt=${PINATA_JWT}
pinata.api-url=https://api.pinata.cloud
pinata.gateway-url=https://gateway.pinata.cloud/ipfs/

# File uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

gemini.api.key=${GEMINI_API_KEY}
gemini.api.model=${GEMINI_API_MODEL:gemini-2.5-flash}